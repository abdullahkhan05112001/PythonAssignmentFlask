{% extends 'base.html' %}

{% block title %}Account Management{% endblock %}

{% block body %}

<div class="container mt-5">
    <h1 class="text-center">View Your Account</h1>
    <hr>

    <div class="card shadow-sm">
        <div class="card-body">
            {% if user %}
            <form>

                <div class="form-group row">
                    <label for="first_name" class="col-sm-3 col-form-label">First Name:</label>
                    <div class="col-sm-9">
                        <input type="text" id="first_name" name="first_name" class="form-control" required value="{{ user['first_name'] }}" readonly>
                    </div>
                </div>

                <div class="form-group row">
                    <label for="last_name" class="col-sm-3 col-form-label">Last Name:</label>
                    <div class="col-sm-9">
                        <input type="text" id="last_name" name="last_name" class="form-control" required value="{{ user['last_name'] }}" readonly>
                    </div>
                </div>

                <div class="form-group row">
                    <label for="email" class="col-sm-3 col-form-label">Email:</label>
                    <div class="col-sm-9">
                        <input type="text" id="email" name="email" class="form-control" required value="{{ user['email'] }}" readonly>
                    </div>
                </div>

                <div class="form-group row">
                    <label for="password" class="col-sm-3 col-form-label">Password:</label>
                    <div class="col-sm-9">
                        <input type="password" id="password" name="password" class="form-control" required value="{{ user['password'] }}" readonly>
                    </div>
                </div>

                <div class="form-group row">
                    <label for="role" class="col-sm-3 col-form-label">Role:</label>
                    <div class="col-sm-9">
                        <input type="text" id="role" name="role" class="form-control" required value="{{ user['role'] }}" readonly>
                    </div>
                </div>

                <div class="form-group row">
                    <label for="date_added" class="col-sm-3 col-form-label">Date Added:</label>
                    <div class="col-sm-9">
                        <input type="text" id="date_added" name="date_added" class="form-control" required value="{{ user['date_added'] }}" readonly>
                    </div>
                </div>

                <div class="form-group row">
                    <label for="date_modified" class="col-sm-3 col-form-label">Date Modified:</label>
                    <div class="col-sm-9">
                        <input type="text" id="date_modified" name="date_modified" class="form-control" required value="{{ user['date_modified'] }}" readonly>
                    </div>
                </div>

            </form>

            <div class="text-center mt-4">
                <form action="{{ url_for('edit_user', user_id=user['_id']) }}" method="GET">
                    <input type="submit" class="btn btn-primary" value="Edit Account" />
                </form>
            </div>
            {% endif %}
        </div>
    </div>
</div>

{% endblock %}
