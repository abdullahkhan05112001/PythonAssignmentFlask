{% extends 'base.html' %}

{% block title %}Account Management{% endblock %}

{% block body %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h3 class="text-center mb-4">Edit Your Account</h3>
                    <hr>

                    {% if user %}
                    <form method="POST" action="{{ url_for('admin_update_user', user_id=user['_id']) }}">

                        <div class="form-group mb-3">
                            <label for="first_name">First Name:</label>
                            <input type="text" id="first_name" name="first_name" class="form-control" required autofocus value="{{ user['first_name'] }}">
                        </div>

                        <div class="form-group mb-3">
                            <label for="last_name">Last Name:</label>
                            <input type="text" id="last_name" name="last_name" class="form-control" required value="{{ user['last_name'] }}">
                        </div>

                        <div class="form-group mb-3">
                            <label for="email">Email:</label>
                            <input type="text" id="email" name="email" class="form-control" required value="{{ user['email'] }}">
                        </div>

                        <div class="form-group mb-3">
                            <label for="password">Password:</label>
                            <input type="text" id="password" name="password" class="form-control" required value="{{ user['password'] }}">
                        </div>

                        <div class="form-group mb-3">
                            <label for="role">Role:</label>
                            <input type="text" id="role" name="role" class="form-control" required value="{{ user['role'] }}">
                        </div>

                        <div class="form-group mb-3">
                            <label for="date_added">Date Added:</label>
                            <input type="text" id="date_added" name="date_added" class="form-control" required value="{{ user['date_added'] }}" readonly>
                        </div>

                        <div class="form-group mb-3">
                            <label for="date_modified">Date Modified:</label>
                            <input type="text" id="date_modified" name="date_modified" class="form-control" required value="{{ user['date_modified'] }}" readonly>
                        </div>

                        <div class="text-center">
                            <button type="submit" class="btn btn-primary">Update Account</button>
                        </div>

                    </form>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
