{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block body %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h2 class="text-center mb-4">Login</h2>

                    {% if current_user.is_authenticated %}
                        <div class="text-center">
                            <p>Welcome, <strong>{{ current_user.email }}</strong></p>
                            <a class="btn btn-outline-primary mb-3" href="{{ url_for('account', user_id=current_user['_id']) }}">Go to Account</a>
                            <br>
                            <a class="btn btn-danger" href="{{ url_for('logout') }}">Logout</a>
                        </div>
                    {% else %}
                        <form method="POST" action="{{ url_for('login') }}">
                            <div class="form-group mb-3">
                                <label for="email">Email:</label>
                                <input type="email" id="email" name="email" class="form-control" placeholder="Enter your email" required autofocus>
                            </div>

                            <div class="form-group mb-3">
                                <label for="password">Password:</label>
                                <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required>
                            </div>

                            <div class="text-center mb-3">
                                <button type="submit" class="btn btn-primary">Login</button>
                            </div>
                        </form>
                    {% endif %}

                    <div class="text-center mt-3">
                        <p>Don't have an account? <a href="{{ url_for('register') }}">Sign up here</a>.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
