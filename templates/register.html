{% extends 'base.html' %}

{% block title %}Register{% endblock %}

{% block body %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h2 class="text-center mb-4">Register for an Account</h2>
                    <hr>
                    <h3>Create an Account</h3>
                    <hr>
                    <form method="POST" action="/register/user">

                        <!-- First Name Field -->
                        <div class="form-group mb-3">
                            <label for="first_name">First Name:</label>
                            <input type="text" id="first_name" name="first_name" class="form-control" required autofocus>
                        </div>

                        <!-- Last Name Field -->
                        <div class="form-group mb-3">
                            <label for="last_name">Last Name:</label>
                            <input type="text" id="last_name" name="last_name" class="form-control" required>
                        </div>

                        <!-- Email Field -->
                        <div class="form-group mb-3">
                            <label for="email">Email:</label>
                            <input type="email" id="email" name="email" class="form-control" required>
                        </div>

                        <!-- Password Field -->
                        <div class="form-group mb-3">
                            <label for="password">Password:</label>
                            <input type="password" id="password" name="password" class="form-control" required>
                        </div>

                        <!-- Role Selection -->
                        <div class="form-group mb-3">
                            <label for="role" class="mr-sm-2">Role:</label>
                            <select name="role" id="role" class="form-select" required>
                                <option value="" selected disabled hidden>Choose role</option>
                                {% for role in all_roles %}
                                <option value="{{ role['role_name'] }}">{{ role['role_name'] }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <!-- Submit Button -->
                        <div class="text-center">
                            <input type="submit" value="Add New User" class="btn btn-primary">
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
